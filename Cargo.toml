[package]
name = "pocketbi-agent"
version = "0.1.0"
edition = "2021"
description = "Outbound connector agent: reverse TCP tunnel to Pocket BI"
license = "MIT"
repository = "https://github.com/pocketbi/agent"
homepage = "https://pocketbi.ai"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[[bin]]
name = "hub"
path = "src/bin/hub.rs"

[[bin]]
name = "echo-server"
path = "src/bin/echo_server.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
